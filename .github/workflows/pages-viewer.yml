name: Publish Bike Share Viewer (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [local]
    paths:
      - app/scripts/bike-share-map/**
      - app/scripts/stats-export/**
      - app/package.json
      - app/bun.lock
      - .github/workflows/pages-viewer.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-viewer
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build bike-share viewer output
        working-directory: app
        run: bun run bike-share-map:viewer

      - name: Prepare Pages artifact (dereference symlinks)
        run: |
          mkdir -p _site
          cp -LR app/scripts/bike-share-map/output/viewer/. _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
