name: Publish Bike Share Viewer (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [local]
    paths:
      - app/scripts/bike-share-map/**
      - app/scripts/stats-export/**
      - app/package.json
      - app/bun.lock
      - .github/workflows/pages-viewer.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-viewer
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Same version the pre-push hook ran the tests with; bump both together.
          bun-version: 1.3.13

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      # Build first: the jsdom page tests (viewerSmoke, detourPage) load the bundles from
      # output/viewer/, and the copies committed in git may be older than the source. Testing
      # before the build blocked correct deploys (and could pass a stale bundle that the fresh
      # build then breaks).
      - name: Build bike-share viewer output
        working-directory: app
        run: bun run bike-share-map:viewer

      # The pre-push hook runs these too, but `git push --no-verify` or a manual dispatch skips it.
      # Includes the check that every inline <script> parses and the jsdom boot of the real pages.
      - name: Test bike-share viewer (against the fresh build)
        working-directory: app
        run: bun x vitest run scripts/bike-share-map

      # buildViewer writes output/history/<OSM date>.json when the data date is new. CI can
      # regenerate it, but git never gets it, and a later re-export would lose that date.
      - name: Check the history snapshot is committed
        run: |
          if git status --porcelain -- app/scripts/bike-share-map/output/history | grep .; then
            echo "::warning::A history snapshot was created in CI; commit it from a local build (bun run bike-share-map:viewer)."
          fi

      - name: Prepare Pages artifact (dereference symlinks)
        run: |
          mkdir -p _site
          cp -LR app/scripts/bike-share-map/output/viewer/. _site/
          rm -rf _site/node_modules _site/stats.geojson
          touch _site/.nojekyll
          du -sh _site

      # GitHub Pages rejects artifacts over 1 GB (and the tarball upload itself gets slow long
      # before). _site holds real files (cp -L above dereferenced the output/ symlinks, and
      # upload-pages-artifact tars with --dereference anyway), so du measures what gets uploaded.
      - name: Check Pages artifact size (limit 900 MB)
        run: |
          size_mb=$(du -smL _site | cut -f1)
          echo "Pages artifact: ${size_mb} MB (GitHub Pages limit 1 GB; this check fails above 900 MB)"
          echo "### Pages artifact: ${size_mb} MB" >> "$GITHUB_STEP_SUMMARY"
          du -smL _site/* | sort -rn | head -15
          if [ "$size_mb" -gt 900 ]; then
            echo "::error::Pages artifact is ${size_mb} MB, above the 900 MB guard (GitHub Pages limit is 1 GB). Shrink output/viewer (see app/scripts/bike-share-map/README.md) before deploying."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Second copy of the same build under the BFS subdomain. A Pages site has exactly one address
  # (with a custom domain, github.io only redirects), so the subdomain is served from its own repo
  # and this repo keeps working on github.io. The build is reused; only the absolute base URL in
  # canonical/og:* tags (SHARE_PAGE_BASE_URL, HTML only) is swapped. Skipped until the
  # MIRROR_DEPLOY_KEY secret exists (private half of a deploy key with write access on MIRROR_REPO).
  # Runs independently of `deploy`, so a failure here never blocks the github.io site.
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    env:
      MIRROR_REPO: LeonhardFeiner/radweg
      MIRROR_DOMAIN: radweg.bfschweitenkirchen.de
      SOURCE_BASE_URL: https://leonhardfeiner.github.io/tilda-geo/
      MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
    steps:
      - name: Check for deploy key
        id: key
        run: |
          if [ -z "$MIRROR_DEPLOY_KEY" ]; then
            echo "MIRROR_DEPLOY_KEY not set; skipping the mirror deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Pages artifact
        if: steps.key.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _artifact

      - name: Prepare mirror site
        if: steps.key.outputs.present == 'true'
        run: |
          mkdir -p _site
          tar -xf _artifact/artifact.tar -C _site
          new_base="https://${MIRROR_DOMAIN}/"
          files=$(grep -rlF --include='*.html' "$SOURCE_BASE_URL" _site || true)
          if [ -z "$files" ]; then
            echo "::error::No HTML file contains $SOURCE_BASE_URL; SHARE_PAGE_BASE_URL in constants.ts changed? Update SOURCE_BASE_URL here."
            exit 1
          fi
          printf '%s\n' "$files" | xargs sed -i "s#${SOURCE_BASE_URL}#${new_base}#g"
          if grep -rqF --include='*.html' "$SOURCE_BASE_URL" _site; then
            echo "::error::Old base URL still present after rewrite"
            exit 1
          fi
          echo "$MIRROR_DOMAIN" > _site/CNAME
          touch _site/.nojekyll
          du -sh _site

      # Orphan force-push: the branch always holds one commit, so the mirror repo doesn't grow
      # by ~500 MB per deploy.
      - name: Push to mirror repo
        if: steps.key.outputs.present == 'true'
        run: |
          install -m 600 /dev/null ~/deploy_key
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > ~/deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push --force "git@github.com:${MIRROR_REPO}.git" gh-pages
          rm -f ~/deploy_key
